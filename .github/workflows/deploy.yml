# Uploads the Wipaco theme to the live site (cPanel) on every push to main that changes it.
# Content (products, prices, guides) is edited on the live admin and is never touched by this.
#
# One-time setup - GitHub repo > Settings > Secrets and variables > Actions > New repository secret:
#   FTP_SERVER    e.g. ftp.wipacoinvestiments.com
#   FTP_USERNAME  the cPanel FTP account whose folder is public_html/wp-content/themes/wipaco
#   FTP_PASSWORD  that FTP account's password
name: Deploy theme to live site

on:
  push:
    branches: [main]
    paths:
      - "theme/wipaco/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # "Run workflow" button on the Actions tab

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v7

      - name: Check PHP files for syntax errors
        run: find theme/wipaco -path theme/wipaco/vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install PDF library (dompdf)
        run: composer install --no-dev --optimize-autoloader --no-interaction --working-dir=theme/wipaco

      - name: Skip upload if FTP secrets are not set yet
        if: env.FTP_SERVER == ''
        run: echo "::warning::FTP secrets not set - checks passed, nothing uploaded. Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD."

      # Cleans the FTP_SERVER secret (spaces, line breaks, ftp://, paths) and checks it before uploading,
      # so a wrong value fails with a clear message instead of a DNS error.
      - name: Check FTP server name and certificate
        if: env.FTP_SERVER != ''
        run: |
          host=$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#[/:].*$##')
          echo "FTP_HOST=$host" >> "$GITHUB_ENV"
          ip=$(getent hosts "$host" | awk '{print $1; exit}')
          if [ -z "$ip" ]; then
            # The domain's only DNS server is the hosting server, which may not answer GitHub's resolver.
            # Ask Google/Cloudflare instead and pin the answer for this run.
            for resolver in 8.8.8.8 1.1.1.1; do
              ip=$(dig +short +time=5 +tries=2 @"$resolver" "$host" A 2>/dev/null | grep -E '^[0-9.]+$' | tail -1)
              [ -n "$ip" ] && break
            done
            if [ -n "$ip" ]; then
              echo "GitHub's DNS could not look up the FTP server; using $resolver's answer instead."
              echo "$ip $host" | sudo tee -a /etc/hosts > /dev/null
            fi
          fi
          if [ -z "$ip" ]; then
            # Safe clues about the secret (it is masked in logs): length, ending, spelling checks.
            echo "FTP_SERVER clues: ${#host} characters, ends with '.${host##*.}', contains 'servconfig': $([[ $host == *servconfig* ]] && echo yes || echo no), contains 'wipacoinvestiments': $([[ $host == *wipacoinvestiments* ]] && echo yes || echo no), contains 'wipacoinvestments' (missing i): $([[ $host == *wipacoinvestments* ]] && echo yes || echo no)"
            echo "::error::FTP_SERVER is not a server name that exists. Set it to only the hostname from cPanel (FTP Accounts > Configure FTP Client), e.g. server123.servconfig.com - no ftp://, no spaces."
            exit 1
          fi
          echo "FTP server found."
          result=$(echo QUIT | timeout 20 openssl s_client -connect "$host:21" -starttls ftp -servername "$host" -verify_hostname "$host" 2>/dev/null | grep -m1 'Verify return code' || true)
          echo "FTPS certificate check: ${result:-no answer}"
          case "$result" in
            *"0 (ok)"*) ;;
            *) echo "::error::The FTP server's security certificate does not match this name. Use the server's own hostname (cPanel > General Information > Server Name, ends in .servconfig.com) as FTP_SERVER."
               exit 1 ;;
          esac

      - name: Upload theme to cPanel (FTPS)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./theme/wipaco/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            composer.json
            composer.lock
            zz-*
